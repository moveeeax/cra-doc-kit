name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Smoke test the CLI on the example deliverables
        run: |
          set -euo pipefail
          go build -o bin/cra-doc-kit ./cmd/cra-doc-kit
          mkdir -p out
          ./bin/cra-doc-kit vex \
            --scan examples/scan.grype.json \
            --triage examples/triage.yaml \
            --profile examples/product.yaml \
            --kev examples/kev.json \
            --out out/vex.json
          ./bin/cra-doc-kit annex \
            --sbom examples/sbom.cdx.json \
            --profile examples/product.yaml \
            --scan examples/scan.grype.json \
            --vex out/vex.json \
            --kev examples/kev.json \
            --out out/annex-vii.md
          # The example SBOM ships a deliberate gap and a KEV-listed finding is
          # still under investigation, so gapcheck is expected to exit 1 here.
          # That it does is part of what is being tested.
          ./bin/cra-doc-kit gapcheck \
            --sbom examples/sbom.cdx.json \
            --scan examples/scan.grype.json \
            --vex out/vex.json \
            --kev examples/kev.json \
            --out out/gap-check.md && rc=0 || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "gapcheck exited $rc, expected 1 for the example inputs"
            exit 1
          fi

      - name: Upload the generated deliverables
        uses: actions/upload-artifact@v7
        with:
          name: example-deliverables-go${{ matrix.go-version }}
          path: out/
          if-no-files-found: error
